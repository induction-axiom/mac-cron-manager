<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>mac-cron-manager</title>
<link id="favicon" rel="icon" href="data:,">
<style>
  /* Radix Colors (radix-ui.com/colors) scales, by step: mauve for the neutrals, plum as the one accent,
     grass / red / amber for status. Steps keep light and dark contrast consistent: 1-2 backgrounds,
     3 selected, 4-6 borders, 9 solid, 11 secondary text, 12 text. To change the accent, swap the three
     --accent* values for another scale's 3 / 9 / 11. site/index.html uses the same tokens. */
  :root {
    --bg: #fdfcfd; --code: #faf9fb; --panel: #f2eff3; --row: #eae7ec; --line: #dbd8e0; --hover: #faf9fb;
    --text: #211f26; --dim: #65636d; --faint: #84828e;
    --sel: #fbebfb; --accent: #ab4aba; --accent-text: #953ea3;
    --ok: #2a7e3b; --fail: #ce2c31; --warn: #ab6400;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121113; --code: #1a191b; --panel: #232225; --row: #2b292d; --line: #3c393f; --hover: #1a191b;
      --text: #eeeef0; --dim: #b5b2bc; --faint: #7c7a85;
      --sel: #351a35; --accent: #ab4aba; --accent-text: #e796f3;
      --ok: #71d083; --fail: #ff9592; --warn: #ffca16;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
               font: 14px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
  body { display: flex; flex-direction: column; }
  a { color: inherit; text-underline-offset: 2px; }
  code, .mono { font-family: var(--mono); font-size: 12.5px; }
  button { font: 500 13px/1.4 var(--sans); color: var(--text); background: var(--bg); border: 1px solid var(--line);
           border-radius: 6px; padding: 3px 11px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button:disabled { opacity: .4; cursor: default; border-color: var(--line); }
  kbd { font: 500 11.5px var(--mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px;
        padding: 0 5px; background: var(--panel); color: var(--text); }
  .dim { color: var(--dim); } .faint { color: var(--faint); } .warn { color: var(--warn); }
  .ok { color: var(--ok); } .fail { color: var(--fail); }

  header { display: flex; gap: 18px; align-items: center; padding: 12px 20px; border-bottom: 1px solid var(--line);
           white-space: nowrap; overflow-x: auto; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; letter-spacing: -.01em; }
  .brand::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: var(--accent); }
  .host { background: var(--panel); font-weight: 600; padding: 2px 10px; border-radius: 6px; }
  .spacer { flex: 1; }
  #clock { font-variant-numeric: tabular-nums; }

  nav { display: flex; gap: 6px; align-items: flex-end; padding: 0 20px; border-bottom: 1px solid var(--line); }
  nav button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; padding: 10px 10px 8px;
               color: var(--dim); background: transparent; font-size: 14px; }
  nav button:hover { color: var(--text); }
  nav button.on { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
  nav .filters { margin-left: auto; display: flex; gap: 4px; padding-bottom: 7px; }
  nav .filters button { border: 1px solid transparent; border-radius: 6px; padding: 2px 10px; font-size: 13px; }
  nav .filters button.on { border-color: var(--line); background: var(--panel); color: var(--text); font-weight: 500; }

  main { flex: 1; display: grid; grid-template-rows: auto 1fr; min-height: 0; }
  .tablewrap { overflow: auto; max-height: 48vh; border-bottom: 1px solid var(--line); }
  table { width: 100%; border-collapse: collapse; }
  th { position: sticky; top: 0; z-index: 1; background: var(--bg); text-align: left; font-weight: 500; color: var(--dim);
       padding: 9px 14px; border-bottom: 1px solid var(--line); font-size: 12.5px; }
  td { padding: 10px 14px; border-bottom: 1px solid var(--row); white-space: nowrap; vertical-align: top; }
  th:first-child, td:first-child { padding-left: 20px; padding-right: 0; width: 1%; }
  tr.job { cursor: pointer; }
  tr.job:hover td { background: var(--hover); }
  tr.job.sel td { background: var(--sel); }
  tr.job.sel td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
  tr.off td:not(:last-child) { opacity: .5; }
  .name { font-weight: 600; }
  td.clip { max-width: 42ch; overflow: hidden; text-overflow: ellipsis; }
  td.clip .name { white-space: nowrap; }
  .sub { color: var(--dim); font-size: 12.5px; margin-top: 2px; }
  td .mono { font-size: 13px; }
  .dot { display: inline-block; width: 1.2em; text-align: center; }
  .spin { display: inline-block; animation: spin 1s steps(8) infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hist { display: inline-flex; gap: 2px; vertical-align: middle; padding-top: 3px; }
  .hist i { width: 5px; height: 14px; border-radius: 2px; background: var(--ok); opacity: .75; cursor: pointer; }
  .hist i.fail { background: var(--fail); opacity: .9; } .hist i.skipped { background: var(--faint); opacity: .4; }
  .hist i:hover { opacity: 1; } .hist i.on { opacity: 1; box-shadow: 0 0 0 1.5px var(--accent); }

  .runs { display: flex; flex-direction: column; gap: 6px; }
  .runhead { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .runhead button { padding: 1px 9px; font-size: 12.5px; }
  .strip { position: relative; display: flex; align-items: stretch; gap: 3px; height: 62px; padding: 20px 10px 6px;
           overflow-x: auto; overflow-y: hidden; background: var(--panel); border-radius: 8px; cursor: pointer;
           user-select: none; -webkit-user-select: none; touch-action: pan-y; scrollbar-width: thin; }
  .strip i { flex: 0 0 9px; display: flex; align-items: flex-end; }
  .strip i::after { content: ""; width: 100%; height: var(--h); border-radius: 2px; background: var(--ok); opacity: .7; }
  .strip i.fail::after { background: var(--fail); opacity: .85; }
  .strip i.skipped::after { background: var(--faint); opacity: .4; }
  .strip i.running::after { opacity: 1; animation: pulse 1.2s ease-in-out infinite alternate; }
  @keyframes pulse { from { opacity: .35; } }
  .strip i:hover::after { opacity: 1; }
  .strip i.on::after { opacity: 1; box-shadow: 0 0 0 2px var(--panel), 0 0 0 3.5px var(--accent); }
  .strip .day { flex: 0 0 1px; background: var(--line); position: relative; margin: 0 5px; }
  .strip .day em { position: absolute; top: -17px; left: -2px; font: 11.5px var(--sans); color: var(--faint); white-space: nowrap; }
  .runmeta { font-size: 13px; color: var(--dim); min-height: 1.55em; }
  .runmeta b { color: var(--text); font-weight: 600; }
  .actions { display: flex; gap: 6px; }
  @media (prefers-reduced-motion: reduce) { .strip i.running::after, .spin { animation: none; } }

  /* the log takes whatever height is left; when even its minimum doesn't fit, the whole pane scrolls */
  .detail { display: flex; flex-direction: column; min-height: 0; overflow-y: auto; padding: 16px 20px; gap: 10px; }
  .detail > * { flex-shrink: 0; }
  .detail .title { font-size: 15px; }
  .cmd { font: 12.5px/1.6 var(--mono); word-break: break-all; background: var(--panel); border-radius: 6px; padding: 7px 12px; }
  .cmd::before { content: "$ "; color: var(--faint); }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 18px; }
  .kv span:nth-child(odd) { color: var(--dim); }
  .kv span:nth-child(even) { font-family: var(--mono); font-size: 12.5px; word-break: break-all; }
  .banner { border-left: 3px solid var(--fail); color: var(--fail); background: var(--panel);
            padding: 6px 12px; border-radius: 0 6px 6px 0; }
  .banner.hint { border-left-color: var(--faint); color: var(--dim); }
  .logbar { display: flex; justify-content: space-between; gap: 12px; color: var(--dim); font-size: 12.5px; margin-top: 4px; }
  #logfile { font-family: var(--mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  pre.log { flex: 1 1 0; margin: 0; overflow: auto; background: var(--code); border: 1px solid var(--line); border-radius: 8px;
            padding: 14px 16px; font: 12.5px/1.7 var(--mono); white-space: pre-wrap; word-break: break-word; min-height: 160px; }
  pre.log:focus { outline: none; border-color: var(--accent); }
  pre.log .err { color: var(--fail); }

  footer { padding: 8px 20px; border-top: 1px solid var(--line); color: var(--dim); display: flex; gap: 20px;
           flex-wrap: wrap; font-size: 12.5px; }

  dialog { width: min(1000px, 94vw); background: var(--bg); color: var(--text); border: 1px solid var(--line);
           border-radius: 10px; padding: 0; }
  dialog::backdrop { background: rgb(10 6 16 / .5); }
  dialog .head { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; }
  dialog .head > span:last-child { font-size: 12.5px; }
  dialog textarea { width: 100%; height: 55vh; background: var(--code); color: var(--text); border: 0; padding: 14px 16px;
                    font: 13px/1.65 var(--mono); resize: vertical; outline: none; }
  dialog .foot { padding: 12px 16px; border-top: 1px solid var(--line); display: flex; gap: 10px; align-items: center; }
  #edit-err { color: var(--fail); white-space: pre-wrap; flex: 1; }

  #toast { position: fixed; right: 20px; bottom: 52px; display: flex; flex-direction: column; gap: 6px; }
  #toast div { background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 8px;
               box-shadow: 0 4px 16px rgb(0 0 0 / .18); }
  #toast div.error { background: var(--fail); color: #fff; }
  .empty { padding: 28px 20px; color: var(--dim); }
</style>
</head>
<body>
<header>
  <span class="brand">mac-cron-manager</span>
  <span class="host" id="host">…</span>
  <span>cron <span id="cron">…</span></span>
  <span id="summary" class="dim"></span>
  <span class="spacer"></span>
  <span id="clock" class="dim"></span>
  <button id="edit-btn" title="e">edit crontab</button>
</header>

<nav id="tabs">
  <button data-tab="cron" class="on">cron <span id="n-cron" class="dim"></span></button>
  <button data-tab="launchd">launchd <span id="n-launchd" class="dim"></span></button>
  <span class="filters" id="filters" hidden>
    <button data-f="all" class="on">all</button><button data-f="user">user</button><button data-f="global">global</button><button data-f="system">system</button><button data-f="issues">issues</button>
  </span>
</nav>

<main>
  <div class="tablewrap">
    <table>
      <thead id="thead"></thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="empty" class="empty" hidden></div>
  </div>
  <section class="detail" id="detail"></section>
</main>

<footer>
  <span><kbd>1</kbd>/<kbd>2</kbd> cron/launchd</span><span><kbd>j</kbd>/<kbd>k</kbd> select</span><span><kbd>←</kbd>/<kbd>→</kbd> past runs</span><span><kbd>r</kbd> run now</span>
  <span><kbd>space</kbd> enable/disable</span><span><kbd>w</kbd> monitor</span><span><kbd>e</kbd> edit crontab</span>
</footer>

<dialog id="editor">
  <div class="head"><span>crontab -e</span><span class="dim">⌘/ctrl+s save · esc cancel · the old crontab is backed up on save</span></div>
  <textarea id="crontab" spellcheck="false"></textarea>
  <div class="foot"><span id="edit-err"></span><button id="cancel">cancel</button><button id="save">save</button></div>
</dialog>

<div id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
// Served by the agent on 127.0.0.1, which answers the /api calls below.

let state = { jobs: [] };                // /api/state: host, whether cron runs, cron jobs
let ld = null;                           // /api/launchd jobs, null until first load
let tab = "cron";
try { tab = localStorage.getItem("mcm.tab") || "cron"; } catch { /* storage unavailable */ }
let filter = "all";
let sel = { cron: null, launchd: null };
let detailKey = null, logSig = null, follow = true;
let runs = {}, runsSig = {};   // cron job name -> all recorded runs (/api/runs), and what they were fetched for
let selRun = {};               // cron job name -> start of the past run being viewed (absent: the latest)
let logTimer = null, reveal = false;  // reveal: scroll the selected run into view once

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function ago(ts) {
  const s = Math.max(0, Math.floor(Date.now() / 1000 - ts));
  for (const [u, n] of [["d", 86400], ["h", 3600], ["m", 60]]) if (s >= n) return `${Math.floor(s / n)}${u} ago`;
  return `${s}s ago`;
}
const when = (ts) => new Date(ts * 1000).toLocaleString("sv-SE").slice(0, 16);
const dur = (s) => (s = Math.floor(s), s >= 60 ? `${Math.floor(s / 60)}m${String(s % 60).padStart(2, "0")}s` : `${s}s`);

function toast(msg, error = false) {
  const el = document.createElement("div");
  el.textContent = msg;
  if (error) el.className = "error";
  $("#toast").append(el);
  setTimeout(() => el.remove(), 3500);
}

async function api(path, body) {
  const opts = body === undefined ? {} : {
    method: "POST", headers: { "Content-Type": "application/json", "X-MCM": "1" }, body: JSON.stringify(body),
  };
  const res = await fetch(path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function setFavicon(color) {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="${color}"/></svg>`;
  $("#favicon").href = "data:image/svg+xml," + encodeURIComponent(svg);
}

// ---------------------------------------------------------------- cron rows

function cronDot(j) {
  if (j.running_since) return '<span class="dot spin">◐</span>';
  if (!j.enabled) return '<span class="dot dim">○</span>';
  if (!j.monitored) return '<span class="dot dim">?</span>';
  if (!j.last) return '<span class="dot dim">·</span>';
  if (j.last.status === "fail") return '<span class="dot fail">●</span>';
  return j.last.status === "skipped" ? '<span class="dot faint">●</span>' : '<span class="dot ok">●</span>';
}
function cronLast(j) {
  if (j.running_since) return '<span class="ok">running</span>';
  if (!j.monitored) return '<span class="dim">not monitored</span>';
  if (!j.last) return '<span class="dim">never</span>';
  if (j.last.status === "fail") return `<span class="fail">${ago(j.last.end)} · exit ${j.last.exit}</span>`;
  if (j.last.status === "skipped") return `${ago(j.last.end)} <span class="dim">· skipped${j.last.reason ? ` (${esc(j.last.reason)})` : ""}</span>`;
  return ago(j.last.end);
}
function cronTook(j) {
  if (j.running_since) return dur(Date.now() / 1000 - j.running_since);
  return j.last && j.last.status !== "skipped" ? dur(j.last.end - j.last.start) : "";
}
const CRON_HEAD = "<tr><th></th><th>job</th><th>schedule</th><th>next</th><th>last</th><th>took</th><th>history</th><th></th></tr>";
const cronRow = (j) => `
  <tr class="job ${j.name === sel.cron ? "sel" : ""} ${j.enabled ? "" : "off"}" data-key="${esc(j.name)}">
    <td>${cronDot(j)}</td>
    <td class="name">${esc(j.name)}</td>
    <td><span class="mono">${esc(j.schedule)}</span><div class="sub">${esc(j.desc)}</div></td>
    <td>${esc(j.next)}</td>
    <td>${cronLast(j)}</td>
    <td>${cronTook(j)}</td>
    <td><span class="hist">${j.history.map((h) => `<i class="${h.status} ${selRun[j.name] === h.start ? "on" : ""}" data-run="${h.start}"
      title="${esc(`${when(h.start)} · ${h.reason || h.status}`)}"></i>`).join("")}</span></td>
    <td><span class="actions">
      <button data-act="run" ${j.running_since ? "disabled" : ""} title="r">run</button>
      <button data-act="toggle" title="space">${j.enabled ? "disable" : "enable"}</button>
      ${j.monitored ? "" : '<button data-act="wrap" title="w">monitor</button>'}
    </span></td>
  </tr>`;

// ---------------------------------------------------------------- launchd rows

function ldState(j) {
  if (!j.readable) return '<span class="dim">unknown</span>';
  if (j.disabled) return '<span class="dim">disabled</span>';
  if (j.pid) return `<span class="ok">running</span> <span class="dim">· pid ${j.pid}</span>`;
  if (j.kind === "daemon") return '<span class="dim">not running</span>';
  if (!j.loaded) return '<span class="dim">not loaded</span>';
  if (j.last_exit) return `<span class="fail">idle · exit ${j.last_exit}</span>`;
  return 'idle <span class="dim">· exit 0</span>';
}
function ldDot(j) {
  if (j.warning) return '<span class="dot fail">!</span>';
  if (j.note) return '<span class="dot faint">–</span>';
  if (j.disabled) return '<span class="dot dim">○</span>';
  if (j.pid) return '<span class="dot ok">●</span>';
  if (j.loaded) return '<span class="dot dim">●</span>';
  return '<span class="dot dim">·</span>';
}
const LD_HEAD = "<tr><th></th><th>label</th><th>where</th><th>trigger</th><th>next</th><th>state</th><th></th></tr>";
const ldRow = (j) => `
  <tr class="job ${j.id === sel.launchd ? "sel" : ""} ${j.disabled ? "off" : ""}" data-key="${esc(j.id)}">
    <td>${ldDot(j)}</td>
    <td class="clip" title="${esc(j.label)}"><span class="name">${esc(j.label)}</span><div class="sub">${j.note ? "no program" : esc(j.developer)}</div></td>
    <td>${j.scope}<div class="sub">${j.kind}</div></td>
    <td>${esc(j.trigger)}</td>
    <td>${esc(j.next || "")}</td>
    <td>${ldState(j)}</td>
    <td><span class="actions">
      ${j.actions.includes("run") ? '<button data-act="run" title="r">run</button>' : ""}
      ${j.actions.includes("toggle") ? `<button data-act="toggle" title="space">${j.disabled ? "enable" : "disable"}</button>` : ""}
    </span></td>
  </tr>`;

function ldVisible() {
  const jobs = ld || [];
  if (filter === "issues") return jobs.filter((j) => j.warning || (j.last_exit && !j.pid));
  return filter === "all" ? jobs : jobs.filter((j) => j.scope === filter);
}

// ---------------------------------------------------------------- render

function currentList() { return tab === "cron" ? state.jobs : ldVisible(); }
const keyOf = (j) => (tab === "cron" ? j.name : j.id);

function render() {
  const jobs = state.jobs;
  $("#host").textContent = state.host;
  $("#cron").innerHTML = state.cron_up ? '<span class="ok">● up</span>' : '<span class="fail">● down</span>';
  const running = jobs.filter((j) => j.running_since).length;
  const failing = jobs.filter((j) => j.enabled && j.last?.status === "fail").length;
  const issues = (ld || []).filter((j) => j.warning).length;
  $("#summary").innerHTML = [running && `${running} running`, failing && `<span class="fail">${failing} failing</span>`]
    .filter(Boolean).join(" · ") || '<span class="ok">all good</span>';
  document.title = failing ? `✗ ${failing} failing · mac-cron-manager` : running ? "◐ mac-cron-manager" : "mac-cron-manager";
  setFavicon(failing ? "#ce2c31" : running ? "#2a7e3b" : "#ab4aba");

  $("#n-cron").textContent = jobs.length;
  $("#n-launchd").innerHTML = ld ? `${ld.length}${issues ? ` <span class="fail">· ${issues} !</span>` : ""}` : "";
  document.querySelectorAll("#tabs [data-tab]").forEach((b) => b.classList.toggle("on", b.dataset.tab === tab));
  $("#filters").hidden = tab !== "launchd";
  document.querySelectorAll("#filters button").forEach((b) => b.classList.toggle("on", b.dataset.f === filter));

  const list = currentList();
  if (!list.find((j) => keyOf(j) === sel[tab])) sel[tab] = list[0] ? keyOf(list[0]) : null;
  $("#thead").innerHTML = tab === "cron" ? CRON_HEAD : LD_HEAD;
  $("#rows").innerHTML = list.map(tab === "cron" ? cronRow : ldRow).join("");
  $("#empty").hidden = list.length > 0;
  $("#empty").innerHTML = tab === "cron" ? "No cron jobs yet. Press <kbd>e</kbd> to edit the crontab."
    : ld ? "Nothing matches this filter." : "Loading launchd jobs…";
  renderDetail();
}

function renderDetail() {
  const d = $("#detail");
  const j = currentList().find((x) => keyOf(x) === sel[tab]);
  if (!j) { d.innerHTML = ""; detailKey = null; return; }
  const key = tab + ":" + keyOf(j) + JSON.stringify(j.warning) + (j.note ?? "") + (j.monitored ?? "") + (j.disabled ?? j.enabled);
  if (key !== detailKey) {
    detailKey = key; logSig = null; follow = true;
    d.innerHTML = tab === "cron" ? cronDetail(j) : ldDetailHtml(j);
    if ($("#strip")) wireStrip(j.name);
    $("#log")?.addEventListener("scroll", (e) => {
      const el = e.target;
      follow = el.scrollTop + el.clientHeight >= el.scrollHeight - 4;
    });
  }
  if (tab === "cron") loadCronLog(j); else loadLdDetail(j);
}

function cronDetail(j) {
  return `
    <div class="title"><span class="name">${esc(j.name)}</span> <span class="dim">· ${esc(j.desc)}${j.enabled ? "" : " · disabled"}</span></div>
    <div class="cmd">${esc(j.command)}</div>
    ${j.warning ? `<div class="banner">${esc(j.warning)}</div>` : ""}
    ${j.monitored ? `<div class="runs">
      <div class="runhead"><span>Run history</span><span class="faint" id="runcount"></span><span class="spacer"></span>
        <span class="faint">click or drag · <kbd>←</kbd> <kbd>→</kbd></span><button id="latest" hidden>back to latest</button></div>
      <div class="strip" id="strip"></div>
      <div class="runmeta" id="runmeta"></div>
    </div>` : ""}
    ${j.monitored ? "" : `<div class="banner hint">Not monitored: press <kbd>w</kbd> to wrap it in cronmon to get status + logs.</div>`}
    <div class="logbar"><span id="logfile"></span><span id="logstate"></span></div>
    <pre class="log" id="log" tabindex="0" title="click to scroll with the keyboard · esc to go back to shortcuts"></pre>`;
}

function ldDetailHtml(j) {
  return `
    <div class="title"><span class="name">${esc(j.label)}</span> <span class="dim">· ${esc(j.developer)} · ${j.scope} ${j.kind}</span></div>
    <div class="cmd">${esc(j.command || "(no program)")}</div>
    ${j.warning ? `<div class="banner">${esc(j.warning)}</div>` : ""}
    ${j.note ? `<div class="banner hint">${esc(j.note)}</div>` : ""}
    <div class="kv">
      <span>plist</span><span>${esc(j.plist)}</span>
      <span>trigger</span><span>${esc(j.trigger)}</span>
      <span>runs</span><span id="ld-runs">…</span>
    </div>
    ${j.kind === "daemon" ? '<div class="banner hint">System daemon: runs as root, so it can only be viewed here.</div>' : ""}
    <div class="logbar"><span id="logfile"></span><span></span></div>
    <pre class="log" id="log" tabindex="0" title="click to scroll with the keyboard · esc to go back to shortcuts"></pre>`;
}

function showLog(text, files, empty = "(no log)") {
  const log = $("#log");
  if (!log) return;
  const sig = files + text.length + text.slice(-200);
  if (sig === logSig) return;
  logSig = sig;
  log.innerHTML = text ? esc(text).replace(/^.*(error|fail|denied|not permitted|exception).*$/gim, '<span class="err">$&</span>')
                       : `<span class="dim">${esc(empty)}</span>`;
  if (follow) log.scrollTop = log.scrollHeight;
}

async function loadCronLog(j) {
  if (!j.monitored) { showLog("", ""); return; }
  loadRuns(j);
  const run = selRun[j.name];
  try {
    const data = await api(`/api/log?name=${encodeURIComponent(j.name)}` + (run ? `&run=${run}` : ""));
    if (tab !== "cron" || j.name !== sel.cron || selRun[j.name] !== run) return;
    const r = run && runList(j).find((x) => x.start === run);
    const empty = r?.status === "skipped" ? `(skipped${r.reason ? `: ${r.reason}` : ""}: nothing ran, so there is no output)`
      : run ? "(this run's output wasn't kept: output is saved per run from now on, for the last 100 runs)" : "(no log)";
    $("#logfile").textContent = data.exists ? data.file : "";
    const real = runList(j).filter((x) => x.status !== "skipped").at(-1);  // skipped runs leave last.log alone
    $("#logstate").innerHTML = run ? `run of ${esc(when(run))}` : j.running_since ? '<span class="ok">● live</span>'
      : real ? `last run that did something · ${esc(when(real.start))}` : "last run";
    showLog(data.exists ? data.text : "", data.file, empty);
  } catch { /* agent restarting; next poll retries */ }
}

// ---------------------------------------------------------------- run timeline

function runList(j) {
  const list = runs[j.name] || [];
  return j.running_since ? [...list, { start: j.running_since, status: "running" }] : list;
}

async function loadRuns(j) {
  const sig = `${j.last?.start}:${j.last?.end}:${j.running_since}`;
  if (runsSig[j.name] !== sig) {
    try { runs[j.name] = (await api(`/api/runs?name=${encodeURIComponent(j.name)}`)).runs; } catch { return; }
    runsSig[j.name] = sig;
  }
  if (tab === "cron" && sel.cron === j.name) drawStrip(j);
}

function barHeight(r) {
  if (r.status === "skipped") return 5;
  if (r.status === "running") return 30;
  return Math.round(Math.min(30, 6 + 5 * Math.log2(1 + (r.end - r.start) / 5)));  // longer runs, taller bars
}

function drawStrip(j) {
  const strip = $("#strip");
  if (!strip) return;
  const list = runList(j);
  const sig = `${list.length}:${list.at(-1)?.start}:${list.at(-1)?.status}`;
  if (strip.dataset.sig !== sig) {
    const atEnd = !strip.dataset.sig || strip.scrollLeft + strip.clientWidth >= strip.scrollWidth - 4;
    let html = "", day = "";
    for (const r of list) {
      const d = new Date(r.start * 1000);
      if (d.toDateString() !== day) {
        day = d.toDateString();
        html += `<span class="day"><em>${d.toLocaleDateString(undefined, { month: "short", day: "numeric" })}</em></span>`;
      }
      html += `<i class="${r.status}" data-run="${r.start}" style="--h:${barHeight(r)}px"></i>`;
    }
    strip.innerHTML = html || '<span class="faint">no runs yet</span>';
    strip.dataset.sig = sig;
    if (atEnd) strip.scrollLeft = strip.scrollWidth;
    $("#runcount").textContent = list.length ? `· ${list.length} runs` : "";
  }
  markRun(j);
}

function markRun(j) {
  const strip = $("#strip");
  const list = runList(j);
  const on = selRun[j.name] ?? list.at(-1)?.start;
  document.querySelectorAll(`#rows tr[data-key="${CSS.escape(j.name)}"] .hist i`)
    .forEach((i) => i.classList.toggle("on", Number(i.dataset.run) === selRun[j.name]));
  if (!strip) return;
  strip.querySelectorAll("i").forEach((i) => i.classList.toggle("on", Number(i.dataset.run) === on));
  const el = strip.querySelector("i.on");
  if (el && reveal) {
    reveal = false;
    if (el.offsetLeft < strip.scrollLeft + 10) strip.scrollLeft = el.offsetLeft - 10;
    else if (el.offsetLeft > strip.scrollLeft + strip.clientWidth - 24) strip.scrollLeft = el.offsetLeft - strip.clientWidth + 24;
  }
  $("#latest").hidden = !(j.name in selRun);
  const i = list.findIndex((r) => r.start === on), r = list[i];
  if (!r) { $("#runmeta").innerHTML = ""; return; }
  const pos = `<span class="faint">· run ${i + 1} of ${list.length}${j.name in selRun ? "" : " (latest)"}</span>`;
  const head = {
    ok: `<span class="ok">● ok</span> · took ${dur(r.end - r.start)} · exit 0`,
    fail: `<span class="fail">● failed</span> · took ${dur(r.end - r.start)} · exit ${r.exit}`,
    skipped: `<span class="faint">● skipped</span>${r.reason ? ` · ${esc(r.reason)}` : ""}`,
    running: `<span class="ok">● running</span> · ${dur(Date.now() / 1000 - r.start)} so far`,
  }[r.status] || esc(r.status);
  $("#runmeta").innerHTML = `<b>${esc(when(r.start))}</b> <span class="faint">(${ago(r.start)})</span> · ${head} ${pos}`;
}

function selectRun(name, start) {
  const j = state.jobs.find((x) => x.name === name);
  if (!j) return;
  const prev = selRun[name];
  if (start == null || start === runList(j).at(-1)?.start) delete selRun[name]; else selRun[name] = start;
  if (selRun[name] === prev) return;
  reveal = true;
  markRun(j);
  logSig = null; follow = true;
  clearTimeout(logTimer);  // while scrubbing, fetch only the run the pointer settles on
  logTimer = setTimeout(() => sel.cron === name && tab === "cron" && loadCronLog(j), 90);
}

function stepRun(j, d) {
  const list = runList(j);
  if (!list.length) return;
  const i = list.findIndex((r) => r.start === (selRun[j.name] ?? list.at(-1).start));
  selectRun(j.name, list[Math.min(list.length - 1, Math.max(0, (i < 0 ? list.length - 1 : i) + d))].start);
}

function wireStrip(name) {
  const strip = $("#strip");
  let drag = false;
  const pick = (e) => {
    const r = strip.getBoundingClientRect();
    const x = Math.min(r.right - 2, Math.max(r.left + 2, e.clientX));
    const bar = document.elementFromPoint(x, r.top + r.height / 2)?.closest("#strip [data-run]");
    if (bar) selectRun(name, Number(bar.dataset.run));
    if (drag && e.clientX < r.left + 24) strip.scrollLeft -= 12;        // drag past an edge to keep going
    else if (drag && e.clientX > r.right - 24) strip.scrollLeft += 12;
  };
  strip.addEventListener("pointerdown", (e) => { drag = true; strip.setPointerCapture(e.pointerId); pick(e); });
  strip.addEventListener("pointermove", (e) => { if (drag) pick(e); });
  for (const ev of ["pointerup", "pointercancel"]) strip.addEventListener(ev, () => { drag = false; });
  strip.addEventListener("wheel", (e) => {  // a plain mouse wheel scrolls the timeline sideways
    if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { strip.scrollLeft += e.deltaY; e.preventDefault(); }
  }, { passive: false });
  $("#latest").onclick = () => selectRun(name, null);
}

async function loadLdDetail(j) {
  try {
    const data = await api(`/api/launchd/detail?id=${encodeURIComponent(j.id)}`);
    if (tab !== "launchd" || j.id !== sel.launchd) return;
    $("#ld-runs").textContent = data.runs ?? "—";
    $("#logfile").textContent = data.log_files.length ? data.log_files.join(", ") : "this job doesn't write a log file";
    $("#log").hidden = !data.log_files.length;
    showLog(data.log, data.log_files.join());
  } catch { /* next poll retries */ }
}

// ---------------------------------------------------------------- data

async function refresh() {
  try {
    state = await api("/api/state");
    render();
  } catch {  // keep showing the last state until the agent is back (launchd restarts it)
    $("#summary").innerHTML = '<span class="fail">agent not responding · retrying…</span>';
    document.title = "mac-cron-manager · agent not responding";
    setFavicon("#8a8a8a");
  }
}

async function refreshLaunchd() {
  try { ld = (await api("/api/launchd")).jobs; render(); } catch { /* agent down: refresh() says so */ }
}

async function act(action, key) {
  try {
    if (tab === "cron") {
      const j = state.jobs.find((x) => x.name === key);
      if (!j) return;
      await api(`/api/${action}`, { line: j.line, raw: j.raw });
      toast({ run: `started ${j.name}`, toggle: `${j.name} ${j.enabled ? "disabled" : "enabled"}`, wrap: `${j.name} is now monitored` }[action]);
      refresh();
    } else {
      const j = (ld || []).find((x) => x.id === key);
      if (!j || !j.actions.includes(action)) return;
      if (action === "toggle" && !j.disabled &&
          !confirm(`Disable ${j.label} for your user?\nIt stops now and won't start again (even after a reboot) until you enable it.`)) return;
      await api(`/api/launchd/${action}`, { id: j.id });
      toast(action === "run" ? `started ${j.label}` : `${j.label} ${j.disabled ? "enabled" : "disabled"}`);
      refreshLaunchd();
    }
  } catch (e) { toast(e.message, true); }
}

// ---------------------------------------------------------------- editor

async function openEditor() {
  const { text } = await api("/api/crontab");
  $("#crontab").value = text;
  $("#edit-err").textContent = "";
  $("#editor").showModal();
  $("#crontab").focus();
}
async function saveEditor() {
  try {
    await api("/api/crontab", { text: $("#crontab").value });
    $("#editor").close();
    toast("crontab saved");
    refresh();
  } catch (e) { $("#edit-err").textContent = e.message; }
}
$("#edit-btn").onclick = openEditor;
$("#save").onclick = saveEditor;
$("#cancel").onclick = () => $("#editor").close();
$("#crontab").addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === "s") { e.preventDefault(); saveEditor(); }
  if (e.key === "Tab") { e.preventDefault(); document.execCommand("insertText", false, "\t"); }
});

// ---------------------------------------------------------------- input

function setTab(t) {
  tab = t;
  try { localStorage.setItem("mcm.tab", t); } catch { /* storage unavailable */ }
  detailKey = null;
  render();
  if (t === "launchd") refreshLaunchd();
}
$("#tabs").addEventListener("click", (e) => {
  const t = e.target.closest("[data-tab]");
  if (t) return setTab(t.dataset.tab);
  const f = e.target.closest("[data-f]");
  if (f) { filter = f.dataset.f; detailKey = null; render(); }
});
$("#rows").addEventListener("click", (e) => {
  const row = e.target.closest("tr.job");
  if (!row) return;
  const btn = e.target.closest("button[data-act]");
  if (btn) return act(btn.dataset.act, row.dataset.key);
  const bar = e.target.closest(".hist i[data-run]");
  if (bar && tab === "cron") {
    const j = state.jobs.find((x) => x.name === row.dataset.key), start = Number(bar.dataset.run);
    if (!j.running_since && j.history.at(-1)?.start === start) delete selRun[j.name]; else selRun[j.name] = start;
    sel.cron = j.name; logSig = null; follow = true; reveal = true;
    return render();
  }
  if (sel[tab] !== row.dataset.key) { sel[tab] = row.dataset.key; render(); }
});
document.addEventListener("keydown", (e) => {
  if ($("#editor").open || e.metaKey || e.ctrlKey || e.altKey) return;
  const log = e.target.closest?.("#log");
  if (log) {  // while the log has focus, keys scroll it instead of driving the dashboard
    const page = log.clientHeight * 0.9;
    const by = { ArrowDown: 40, ArrowUp: -40, PageDown: page, PageUp: -page, " ": e.shiftKey ? -page : page,
                 Home: -log.scrollHeight, End: log.scrollHeight }[e.key];
    if (by !== undefined) { e.preventDefault(); log.scrollBy(0, by); }
    if (e.key === "Escape") log.blur();
    return;
  }
  const keys = currentList().map(keyOf);
  const i = keys.indexOf(sel[tab]);
  const move = (d) => { sel[tab] = keys[Math.min(keys.length - 1, Math.max(0, i + d))]; render(); };
  const j = currentList()[i];
  switch (e.key) {
    case "1": setTab("cron"); break;
    case "2": setTab("launchd"); break;
    case "j": case "ArrowDown": e.preventDefault(); move(1); break;
    case "k": case "ArrowUp": e.preventDefault(); move(-1); break;
    case "ArrowLeft": case "h": if (tab === "cron" && j?.monitored) { e.preventDefault(); stepRun(j, -1); } break;
    case "ArrowRight": case "l": if (tab === "cron" && j?.monitored) { e.preventDefault(); stepRun(j, 1); } break;
    case "Escape": if (tab === "cron" && j && j.name in selRun) selectRun(j.name, null); break;
    case "r": act("run", sel[tab]); break;
    case " ": e.preventDefault(); act("toggle", sel[tab]); break;
    case "w": if (tab === "cron" && j && !j.monitored) act("wrap", sel[tab]); break;
    case "e": e.preventDefault(); openEditor(); break;
  }
});

setInterval(() => { $("#clock").textContent = new Date().toLocaleString("sv-SE"); }, 1000);
(function poll() {
  refresh().finally(() => setTimeout(poll, state.jobs.some((j) => j.running_since) ? 1000 : 2500));
})();
(function pollLaunchd() {
  refreshLaunchd().finally(() => setTimeout(pollLaunchd, tab === "launchd" ? 3000 : 15000));
})();
</script>
</body>
</html>
